<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">What Git Note History does</title>
<desc id="d">Search the past: find a sentence that is gone and the commit that removed it. Compare any two versions: side by side, unified, rendered, or by headings, lists and tasks. Take back one part: bring back one paragraph, with a preview and undo.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
<rect x="24" y="16" width="368" height="158" rx="22" fill="#F4F7FA" stroke="#DCE5EC"/>
<rect x="52" y="44" width="48" height="48" rx="14" fill="#D8ECFF"/>
<circle cx="73" cy="65" r="9" fill="none" stroke="#2D4F7A" stroke-width="3"/><path d="M80 72 L87 79" stroke="#2D4F7A" stroke-width="3" stroke-linecap="round"/>
<text x="120" y="78" font-size="27" font-weight="700" fill="#15232F">Search the past</text>
<text x="52" y="138" font-size="20" fill="#5B6B78">Find what you deleted, and when.</text>
<rect x="416" y="16" width="368" height="158" rx="22" fill="#F4F7FA" stroke="#DCE5EC"/>
<rect x="444" y="44" width="48" height="48" rx="14" fill="#D8ECFF"/>
<rect x="454" y="56" width="12" height="4" rx="2" fill="#C4383E"/><rect x="454" y="66" width="12" height="4" rx="2" fill="#5B6B78"/><rect x="454" y="76" width="12" height="4" rx="2" fill="#C4383E"/><rect x="470" y="56" width="12" height="4" rx="2" fill="#207B53"/><rect x="470" y="66" width="12" height="4" rx="2" fill="#5B6B78"/><rect x="470" y="76" width="12" height="4" rx="2" fill="#207B53"/>
<text x="512" y="78" font-size="27" font-weight="700" fill="#15232F">Compare any two</text>
<text x="444" y="138" font-size="20" fill="#5B6B78">Side by side, or heading by heading.</text>
<rect x="808" y="16" width="368" height="158" rx="22" fill="#F4F7FA" stroke="#DCE5EC"/>
<rect x="836" y="44" width="48" height="48" rx="14" fill="#D8ECFF"/>
<rect x="852" y="56" width="22" height="4" rx="2" fill="#5B6B78"/><rect x="852" y="65" width="22" height="4" rx="2" fill="#2D4F7A"/><rect x="852" y="74" width="16" height="4" rx="2" fill="#5B6B78"/><path d="M848 60 C840 64 840 72 848 76" fill="none" stroke="#2D4F7A" stroke-width="2.5" stroke-linecap="round"/><path d="M844 56 L848 60 L844 64" fill="none" stroke="#2D4F7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="904" y="78" font-size="27" font-weight="700" fill="#15232F">Take back one part</text>
<text x="836" y="138" font-size="20" fill="#5B6B78">Preview first. Undo any time.</text>
</g></svg>
