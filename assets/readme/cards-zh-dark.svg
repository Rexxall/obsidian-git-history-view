<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">Git Note History 能做什么</title>
<desc id="d">找回过去：搜索删掉的句子及删除它的提交。任意两版对比：双栏、单栏、阅读或结构视图。只取回一段：先预览，再恢复，可以撤销。</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
<rect x="24" y="16" width="368" height="158" rx="22" fill="#0F1822" stroke="#22303D"/>
<rect x="52" y="44" width="48" height="48" rx="14" fill="#1C3044"/>
<circle cx="73" cy="65" r="9" fill="none" stroke="#8EC5FF" stroke-width="3"/><path d="M80 72 L87 79" stroke="#8EC5FF" stroke-width="3" stroke-linecap="round"/>
<text x="120" y="78" font-size="27" font-weight="700" fill="#E6EEF5">找回过去</text>
<text x="52" y="138" font-size="20" fill="#93A4B3">删掉的话，哪天删的，一搜就有。</text>
<rect x="416" y="16" width="368" height="158" rx="22" fill="#0F1822" stroke="#22303D"/>
<rect x="444" y="44" width="48" height="48" rx="14" fill="#1C3044"/>
<rect x="454" y="56" width="12" height="4" rx="2" fill="#F07C80"/><rect x="454" y="66" width="12" height="4" rx="2" fill="#93A4B3"/><rect x="454" y="76" width="12" height="4" rx="2" fill="#F07C80"/><rect x="470" y="56" width="12" height="4" rx="2" fill="#5CC892"/><rect x="470" y="66" width="12" height="4" rx="2" fill="#93A4B3"/><rect x="470" y="76" width="12" height="4" rx="2" fill="#5CC892"/>
<text x="512" y="78" font-size="27" font-weight="700" fill="#E6EEF5">任意两版对比</text>
<text x="444" y="138" font-size="20" fill="#93A4B3">并排看，或按标题逐段看。</text>
<rect x="808" y="16" width="368" height="158" rx="22" fill="#0F1822" stroke="#22303D"/>
<rect x="836" y="44" width="48" height="48" rx="14" fill="#1C3044"/>
<rect x="852" y="56" width="22" height="4" rx="2" fill="#93A4B3"/><rect x="852" y="65" width="22" height="4" rx="2" fill="#8EC5FF"/><rect x="852" y="74" width="16" height="4" rx="2" fill="#93A4B3"/><path d="M848 60 C840 64 840 72 848 76" fill="none" stroke="#8EC5FF" stroke-width="2.5" stroke-linecap="round"/><path d="M844 56 L848 60 L844 64" fill="none" stroke="#8EC5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="904" y="78" font-size="27" font-weight="700" fill="#E6EEF5">只取回一段</text>
<text x="836" y="138" font-size="20" fill="#93A4B3">先预览，随时撤销。</text>
</g></svg>
