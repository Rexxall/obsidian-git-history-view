<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">Git Note History 能做什么</title>
<desc id="d">Search the past: find a sentence that is gone and the commit that removed it. Compare any two versions: side by side, unified, rendered, or by headings, lists and tasks. Take back one part: bring back one paragraph, with a preview and undo.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
<rect x="24" y="16" width="368" height="158" rx="22" fill="#15141B" stroke="#2C2A36"/>
<rect x="52" y="44" width="48" height="48" rx="14" fill="#2C2643"/>
<circle cx="73" cy="65" r="9" fill="none" stroke="#A48BFF" stroke-width="3"/><path d="M80 72 L87 79" stroke="#A48BFF" stroke-width="3" stroke-linecap="round"/>
<text x="120" y="78" font-size="27" font-weight="700" fill="#EEECF5">找回过去</text>
<text x="52" y="138" font-size="20" fill="#9C98AF">删掉的话，哪天删的，一搜就有。</text>
<rect x="416" y="16" width="368" height="158" rx="22" fill="#15141B" stroke="#2C2A36"/>
<rect x="444" y="44" width="48" height="48" rx="14" fill="#2C2643"/>
<rect x="454" y="56" width="12" height="4" rx="2" fill="#F07C80"/><rect x="454" y="66" width="12" height="4" rx="2" fill="#9C98AF"/><rect x="454" y="76" width="12" height="4" rx="2" fill="#F07C80"/><rect x="470" y="56" width="12" height="4" rx="2" fill="#5CC892"/><rect x="470" y="66" width="12" height="4" rx="2" fill="#9C98AF"/><rect x="470" y="76" width="12" height="4" rx="2" fill="#5CC892"/>
<text x="512" y="78" font-size="27" font-weight="700" fill="#EEECF5">任意两版对比</text>
<text x="444" y="138" font-size="20" fill="#9C98AF">并排看，或按标题逐段看。</text>
<rect x="808" y="16" width="368" height="158" rx="22" fill="#15141B" stroke="#2C2A36"/>
<rect x="836" y="44" width="48" height="48" rx="14" fill="#2C2643"/>
<rect x="852" y="56" width="22" height="4" rx="2" fill="#9C98AF"/><rect x="852" y="65" width="22" height="4" rx="2" fill="#A48BFF"/><rect x="852" y="74" width="16" height="4" rx="2" fill="#9C98AF"/><path d="M848 60 C840 64 840 72 848 76" fill="none" stroke="#A48BFF" stroke-width="2.5" stroke-linecap="round"/><path d="M844 56 L848 60 L844 64" fill="none" stroke="#A48BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="904" y="78" font-size="27" font-weight="700" fill="#EEECF5">只取回一段</text>
<text x="836" y="138" font-size="20" fill="#9C98AF">先预览，随时撤销。</text>
</g></svg>
