<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Git Note History</title>
  <desc id="d">Find the sentence you deleted, see which commit removed it, and take back only that part. A note's timeline shows that “The best plans leave one afternoon empty.” was added in “Write the rule down” and removed in “Rewrite the middle, drop the slogan”.</desc>
  <rect width="1200" height="400" rx="28" fill="#F4F7FA"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#2D4F7A">OBSIDIAN PLUGIN · BROWSE NOTE HISTORY</text>
    <text x="62" y="196" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#15232F">Git Note History</text>
    <text x="64" y="252" font-size="29" fill="#15232F">Find the sentence you deleted.</text>
    <text x="64" y="292" font-size="29" fill="#5B6B78">Take back only that part.</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#5B6B78">free · no account · no network</text>
  </g>

  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="724" y="32" width="436" height="304" rx="20" fill="#D8ECFF" stroke="#2D4F7A"/>
    <rect x="712" y="40" width="436" height="304" rx="20" fill="#F4F7FA" stroke="#2D4F7A"/>
    <rect x="700" y="48" width="436" height="304" rx="20" fill="#FFFFFF" stroke="#DCE5EC"/>
    <rect x="724" y="72" width="388" height="44" rx="22" fill="#F4F7FA" stroke="#DCE5EC"/>
    <circle cx="748" cy="92" r="7" fill="none" stroke="#2D4F7A" stroke-width="2"/>
    <path d="M753 97 L759 103" stroke="#2D4F7A" stroke-width="2" stroke-linecap="round"/>
    <text x="770" y="101" font-size="19" fill="#15232F">one afternoon empty</text>

    <path d="M742 150 V258" stroke="#DCE5EC" stroke-width="2"/>

    <circle cx="742" cy="150" r="6" fill="#FFFFFF" stroke="#2D4F7A" stroke-width="2"/>
    <text x="764" y="157" font-size="20" fill="#15232F">Add ending</text>

    <rect x="724" y="178" width="388" height="48" rx="12" fill="#2D4F7A"/>
    <circle cx="742" cy="202" r="6" fill="#FFFFFF"/>
    <text x="764" y="209" font-size="20" font-weight="600" fill="#FFFFFF">Rewrite the middle…</text>
    <rect x="990" y="189" width="108" height="26" rx="13" fill="#FCEBEC"/>
    <text x="1044" y="207" font-size="17" text-anchor="middle" fill="#C4383E">removed it</text>

    <circle cx="742" cy="254" r="6" fill="#FFFFFF" stroke="#2D4F7A" stroke-width="2"/>
    <text x="764" y="261" font-size="20" fill="#15232F">Write the rule down</text>
    <rect x="1006" y="241" width="92" height="26" rx="13" fill="#E5F4EC"/>
    <text x="1052" y="259" font-size="17" text-anchor="middle" fill="#207B53">added it</text>

    <rect x="724" y="290" width="388" height="40" rx="10" fill="#FCEBEC"/>
    <text x="742" y="316" font-size="19" fill="#C4383E" text-decoration="line-through">…leave one afternoon empty.</text>
  </g>
</svg>
