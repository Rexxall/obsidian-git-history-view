name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag against the version files
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag $TAG is not on main" >&2; exit 1; }
          node scripts/check-release-tag.mjs "$TAG"

      # Lint, tests, a clean build, the release zip and a byte check of the build.
      - run: npm run release:check
      # styles.css is built from styles/ and committed; it must match the sources.
      - name: Check committed build output
        run: git diff --exit-code -- styles.css

      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md

      - name: Attest the release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --notes-file release-notes.md --verify-tag
